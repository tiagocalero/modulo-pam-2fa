# /etc/totp.conf  Parametros globales del modulo pam_totp

# muchas apps de autenticacion ignoran 'digits' y 'algorithm' del QR y usa
# siempre SHA1 con 6 digitos. Si los cambias, esa app va a generar codigos
# que nunca validan, y sin dar ningun error.

digits = 6
algorithm = SHA1  # SHA1, SHA256, SHA512
period = 30
window = 3

# Limite de intentos por usuario
rate_limit_attempts = 3 
rate_limit_window   = 30
